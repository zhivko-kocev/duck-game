name: CI/CD Duck Game

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        run: |
          docker build -t kocew/duck-game-backend:latest ./codechem-duck-game
          docker push kocew/duck-game-backend:latest

      - name: Build & push frontend
        run: |
          docker build -t kocew/duck-game-frontend:latest ./codechem-duck-game-frontend
          docker push kocew/duck-game-frontend:latest

      - name: SSH to VM & deploy
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          script: |
            cd /home/your-user/duck-game
            docker-compose pull
            docker-compose up -d
