name: Deploy Duck Game to AKS (Docker Hub)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/duck-game-backend:latest ./codechem-duck-game
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/duck-game-backend:latest

      - name: Build & Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/duck-game-frontend:latest ./codechem-duck-game-frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/duck-game-frontend:latest

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group demo-projects \
            --name duck-game \
            --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/duck-game-backend
          kubectl rollout status deployment/duck-game-frontend
