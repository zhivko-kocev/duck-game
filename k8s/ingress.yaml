apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duck-game-ingress
  namespace: duck-game
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: duck-game-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: duck-game-backend
                port:
                  number: 8080
